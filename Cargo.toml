[workspace]
members = [
    ".",
    "crates/nii-tools",
]
resolver = "2"

[package]
name = "nii-rs"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust library for reading/writing NIfTI-1 files, with SimpleITK/NiBabel-like APIs."
readme = "README.md"
repository = "https://github.com/Plasma-Blue/nii-rs"
keywords = ["medical-imaging", "nii", "nifti", "nibabel", "ITK"]
categories = ["computer-vision", "science::neuroscience"]

[lib]
name = "nii"
crate-type = ["cdylib", "lib"]

[dependencies]
ndarray = "0.15"
bytemuck = "1.21"
rayon = "1.10"
flate2 = "1"

# Python bindings (optional)
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
numpy = { version = "0.23", optional = true }

[features]
default = []
python = ["pyo3", "numpy"]
